# Docs CI — local Markdown links/anchors, heading hierarchy, tables, and index
# coverage (scripts/check-docs.mjs).
#
# Not path-filtered: docs link into screenshots, brand assets, package rules,
# skills, and source files, so renaming or deleting any tracked file can break a
# link. The check is a dependency-free Node script that runs in seconds.

name: docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    name: links, headings, and tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check documentation
        run: node scripts/check-docs.mjs
