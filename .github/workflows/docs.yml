name: docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README*.md"
      - "docs/**"
      - "assets/brand/**"
      - "scripts/check-docs.mjs"
      - "scripts/README.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "README*.md"
      - "docs/**"
      - "assets/brand/**"
      - "scripts/check-docs.mjs"
      - "scripts/README.md"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    name: links, headings, and tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check documentation
        run: node scripts/check-docs.mjs
